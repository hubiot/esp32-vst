[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_extra_dirs = C:\Users\qubil\OneDrive\workplace\Arduino
monitor_speed = 115200
upload_port = com6
monitor_port = com6
lib_deps = knolleary/PubSubClient@^2.8
;monitor_filters = time, log2file

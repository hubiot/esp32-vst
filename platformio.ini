; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; 共通設定: ファームウェアバージョン (ここで一元管理)
[common]
firmware_version = \"v1.0.0\"

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; lib_extra_dirs = C:\Users\atoru\OneDrive\workplace\Arduino
monitor_speed = 115200
upload_port = com6
monitor_port = com6
lib_deps = knolleary/PubSubClient@^2.8
board_build.partitions = min_spiffs.csv
debug_tool = esp-bridge
debug_speed = 5000
debug_init_break = tbreak setup
build_type = debug
; 機種定義: VST100 / VST01 / VST01R のいずれか1つを有効化 (デフォルト: VST100)
build_flags = 
  -D VST100
; -D VST01
; -D VST01R
  -D FIRMWARE_VERSION=${common.firmware_version}

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
; ESP32のIPアドレスまたはmDNSホスト名(esp32-vst.local)を指定
; upload_port = 192.168.0.168
upload_port = esp32-vst.local   ; ← IPアドレスではなくホスト名を指定
; 必要に応じてポートや認証パスワードを設定可能
; upload_flags =
;   --port=3232
;   --auth=password
build_flags = 
  ${env:esp32dev.build_flags}
  -D ENABLE_DEV_OTA

; --- 機種別環境 (PlatformIOの環境切替から直接選択可能) ---
[env:esp32dev-vst100]
extends = env:esp32dev
build_flags = 
  -D VST100
  -D FIRMWARE_VERSION=${common.firmware_version}

[env:esp32dev-vst01]
extends = env:esp32dev
build_flags = 
  -D VST01
  -D FIRMWARE_VERSION=${common.firmware_version}

[env:esp32dev-vst01r]
extends = env:esp32dev
build_flags = 
  -D VST01R
  -D FIRMWARE_VERSION=${common.firmware_version}



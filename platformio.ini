; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; 共通設定: ファームウェアバージョン番号 (ここで一元管理)
[common]
version = "v1.0.0"

[platformio]
default_envs = esp32dev-vst01r

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; lib_extra_dirs = C:\Users\atoru\OneDrive\workplace\Arduino
monitor_speed = 115200
upload_port = com9
monitor_port = com9
lib_deps = knolleary/PubSubClient@^2.8
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
debug_tool = esp-bridge
debug_speed = 5000
debug_init_break = tbreak setup
build_type = debug
extra_scripts = post:rename_firmware.py
build_flags = 
  -D VST100
  -D FIRMWARE_VERSION=\"vst100-${common.version}\"

; --- 機種別環境 (PlatformIOの環境切替から直接選択可能) ---
[env:esp32dev-vst100]
extends = env:esp32dev
build_flags = 
  -D VST100
  -D FIRMWARE_VERSION=\"vst100-${common.version}\"

[env:esp32dev-vst01]
extends = env:esp32dev
build_flags = 
  -D VST01
  -D FIRMWARE_VERSION=\"vst01-${common.version}\"

[env:esp32dev-vst01r]
extends = env:esp32dev
build_flags = 
  -D VST01R
  -D FIRMWARE_VERSION=\"vst01r-${common.version}\"


